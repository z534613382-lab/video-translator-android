name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract Android source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo 'ERROR: No ZIP file found in repository root.'
            exit 1
          fi
          mkdir -p source
          unzip -q "$ZIP" -d source
          SETTINGS=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo 'ERROR: No settings.gradle found in extracted source.'
            find source -maxdepth 4 -type f | head -100
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found under $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 4 -type f | head -100
            exit 1
          fi
          SDKMANAGER_DIR=$(dirname "$SDKMANAGER")
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "Using Android SDK at $SDK_ROOT"
          echo "Using sdkmanager at $SDKMANAGER"

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android platform and build tools
        shell: bash
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoTranslator-debug-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
