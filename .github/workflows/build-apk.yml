name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract Android source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo 'ERROR: No ZIP file found in repository root.'
            exit 1
          fi
          mkdir -p source
          unzip -q "$ZIP" -d source
          SETTINGS=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo 'ERROR: No settings.gradle found in extracted source.'
            find source -maxdepth 4 -type f | head -100
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Download offline speech models
        shell: bash
        run: |
          set -euo pipefail
          ASSET_DIR="$PROJECT_DIR/app/src/main/assets"
          mkdir -p "$ASSET_DIR"
          declare -A MODELS=(
            [model-en]='https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip'
            [model-ja]='https://alphacephei.com/vosk/models/vosk-model-small-ja-0.22.zip'
            [model-cn]='https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip'
          )
          for target in "${!MODELS[@]}"; do
            archive="/tmp/${target}.zip"
            work="/tmp/${target}-unpacked"
            rm -rf "$work" "$ASSET_DIR/$target"
            curl --fail --location --retry 3 "${MODELS[$target]}" -o "$archive"
            mkdir -p "$work"
            unzip -q "$archive" -d "$work"
            source_dir=$(find "$work" -mindepth 1 -maxdepth 1 -type d -print -quit)
            mv "$source_dir" "$ASSET_DIR/$target"
          done
          du -sh "$ASSET_DIR"/*

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found under $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 4 -type f | head -100
            exit 1
          fi
          SDKMANAGER_DIR=$(dirname "$SDKMANAGER")
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "Using Android SDK at $SDK_ROOT"
          echo "Using sdkmanager at $SDKMANAGER"

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android platform and build tools
        shell: bash
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoTranslator-debug-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
